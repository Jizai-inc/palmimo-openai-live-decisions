[project]
name = "palmimo-live-agent"
version = "0.1.0"
description = "Full-duplex Palmimo companion with GPT-Live and native Decisions reactions"
authors = [{ name = "Jizai Inc." }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "numpy>=1.26,<2",
    "palmimo-sdk[agent]==0.1.3",
    "python-dotenv>=1.2.4",
    "websockets>=17.1,<18",
]

[project.scripts]
palmimo-live-agent = "palmimo_live_agent.cli:main"

[project.urls]
Repository = "https://github.com/Jizai-inc/palmimo-live-agent"
Issues = "https://github.com/Jizai-inc/palmimo-live-agent/issues"
Documentation = "https://github.com/Jizai-inc/palmimo-live-agent#readme"

[project.optional-dependencies]
robot = [
    "palmimo-companion-agent @ git+https://github.com/Jizai-inc/palmimo-devkit.git@5b545d1a8d5551822460d2aa9edd37c4d02c147f#subdirectory=examples/agents/companion",
    "palmimo-sdk[agent,face,hardware,vision,voice]==0.1.3",
]

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "opencv-python>=4,<4.12",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
